name: Evening sleep colors
on:
  push:
    paths: ['index.html', 'sw.js', 'sleep-colors.js', 'tests/sleep-colors.test.cjs', '.github/workflows/sleep-colors.yml']
  pull_request:
    paths: ['index.html', 'sw.js', 'sleep-colors.js', 'tests/sleep-colors.test.cjs', '.github/workflows/sleep-colors.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/sleep-colors.test.cjs
