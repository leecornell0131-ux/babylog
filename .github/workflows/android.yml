# 갤럭시용 아기로그 APK를 무료로 빌드해서 GitHub 릴리스에 올림 (공개 저장소라 GitHub Actions 무료)
# 설치 주소(항상 최신): https://github.com/leecornell0131-ux/babylog/releases/latest/download/babylog.apk
name: Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk babylog.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          MSG="$(git log -1 --pretty=%s)"
          gh release create "$TAG" android-app/babylog.apk \
            --target "${{ github.sha }}" \
            --title "아기로그 안드로이드 0.1.${{ github.run_number }}" \
            --notes "- ${MSG}" \
            --latest
