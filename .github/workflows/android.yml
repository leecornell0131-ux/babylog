# 갤럭시용 아기로그 APK를 무료로 빌드해서 GitHub 릴리스에 올림 (공개 저장소라 GitHub Actions 무료)
# 설치 주소(항상 최신): https://github.com/leecornell0131-ux/babylog/releases/latest/download/babylog.apk
name: Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 러너에 Android SDK가 이미 깔려 있음 (ANDROID_HOME)
      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk babylog.apk

      # Play 스토어용 AAB (업로드 키 Secrets가 있을 때만). 같은 빌드 번호라 APK와 버전이 같음.
      # 키 만들기·넣는 법: guide 폴더의 Play 안내서
      # AAB가 실패해도 갤럭시용 APK 릴리스는 계속 올라가게 함
      - name: Build Play AAB
        id: aab
        continue-on-error: true
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        working-directory: android-app
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ]; then echo "업로드 키 없음: AAB 건너뜀"; exit 0; fi
          # 붙여넣을 때 섞인 줄바꿈·공백·윈도우 줄끝(CR)·certutil 머리줄(-----)을 걷어내고 풂
          printf '%s' "$PLAY_UPLOAD_KEYSTORE" | tr -d '\r' | grep -v '^-----' | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/upload.jks" \
            || { echo "::error::PLAY_UPLOAD_KEYSTORE 값이 base64 형식이 아님. 비밀_Play업로드키 폴더의 base64 텍스트 전체를 다시 붙여넣어 주세요."; exit 1; }
          echo "키 파일 크기: $(wc -c < "$RUNNER_TEMP/upload.jks") 바이트"
          PLAY_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease -Pstore=true
          cp app/build/outputs/bundle/release/app-release.aab babylog-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "built=1" >> "$GITHUB_OUTPUT"

      - name: Keep AAB
        if: steps.aab.outputs.built == '1'
        uses: actions/upload-artifact@v4
        with:
          name: babylog-play-aab
          path: android-app/babylog-play.aab

      # 다른 브랜치에서 만든 APK는 내려받기용으로만 남기고, 설치 주소(최신 릴리스)에는 main만 올림
      - name: Keep APK (branch build)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: babylog-apk
          path: android-app/babylog.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          MSG="$(git log -1 --pretty=%s)"
          FILES="android-app/babylog.apk"
          [ -f android-app/babylog-play.aab ] && FILES="$FILES android-app/babylog-play.aab"
          gh release create "$TAG" $FILES \
            --target "${{ github.sha }}" \
            --title "아기로그 안드로이드 0.1.${{ github.run_number }}" \
            --notes "- ${MSG}" \
            --latest
