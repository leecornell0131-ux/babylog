# 아기로그 아이폰 앱을 Codemagic(Mac 클라우드, 개인 무료 구간)에서 빌드해 TestFlight에 올림.
# Mac이 없어서 Xcode 프로젝트는 빌드할 때 ios-app/project.yml로 만듦(XcodeGen).
# main에 아이폰 앱 코드(ios-app/)나 이 파일이 바뀌어 올라오면 자동으로 빌드해 TestFlight에 올림.
# 아이폰 앱 화면은 웹앱을 띄우는 것이라 웹앱만 바뀌면 빌드하지 않음 (무료 시간 아낌). 손으로는 "Start new build".
# 위젯(kr.babylog.app.widget)의 App ID·배포 프로필은 빌드가 API 키로 직접 만들고 다시 씀 (Apple 사이트에서 손댈 것 없음).
workflows:
  ios-testflight:
    name: 아이폰 TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - ios-app/
          - codemagic.yaml
          - android-app/app/src/main/assets/bridge.js
    integrations:
      # Codemagic 팀 설정 > Integrations > Developer Portal에 이 이름으로 API 키를 연결해야 함
      app_store_connect: babylog
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kr.babylog.app
      xcode: latest
    scripts:
      - name: Xcode 프로젝트 만들기
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios-app && xcodegen generate
      - name: 위젯 서명 준비
        script: |
          set -e
          W=kr.babylog.app.widget
          NAME="babylog widget appstore"
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          first_id() { python3 -c 'import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(d[0]["id"] if d else "")'; }
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$W" --strict-match-identifier --json | first_id)
          if [ -z "$BID" ]; then
            BID=$(app-store-connect bundle-ids create "$W" --name "Babylog Widget" --platform IOS --json | first_id)
          fi
          echo "위젯 App ID: $BID"
          PID=$(app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE --name "$NAME" --json | first_id)
          if [ -n "$PID" ]; then
            app-store-connect profiles get "$PID" --save --profiles-dir "$DIR"
          else
            CERTS=$(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json | python3 -c 'import json,sys; print(" ".join(c["id"] for c in json.load(sys.stdin)))')
            echo "배포 인증서: $CERTS"
            app-store-connect profiles create "$BID" --type IOS_APP_STORE --name "$NAME" --certificate-ids $CERTS --save --profiles-dir "$DIR"
          fi
          ls "$DIR"
      - name: 서명 파일 적용
        script: xcode-project use-profiles --project ios-app/Babylog.xcodeproj
      - name: 빌드 번호 올리기
        script: cd ios-app && agvtool new-version -all "$BUILD_NUMBER"
      - name: 앱 파일(ipa) 만들기
        script: xcode-project build-ipa --project ios-app/Babylog.xcodeproj --scheme Babylog
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # 내부 테스트(본인·배우자 Apple ID)는 Apple 심사 없이 올라가자마자 받을 수 있음
        submit_to_testflight: false
