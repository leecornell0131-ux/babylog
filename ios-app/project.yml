# 아기로그 아이폰 앱 프로젝트 설정. Mac 없이 클라우드(Codemagic·GitHub Actions)에서
# XcodeGen으로 Xcode 프로젝트를 만들어 빌드함. 그래서 .xcodeproj는 저장소에 넣지 않음.
name: Babylog
options:
  bundleIdPrefix: kr.babylog
  # Siri 음성 명령(VoiceIntents.swift)의 말이 한국어로 등록되게
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  Babylog:
    type: application
    platform: iOS
    sources:
      - Babylog
      - Shared
      # 웹앱과 잇는 코드는 갤럭시 앱과 같은 파일을 그대로 씀 (요약 계산·위젯 버튼 동작이 양쪽에서 똑같게)
      - path: ../android-app/app/src/main/assets/bridge.js
        buildPhase: resources
    dependencies:
      - target: BabylogWidget
      # 애플워치 앱 (아이폰 앱 안 Watch 폴더에 같이 들어가 App Store에 한 번에 올라감)
      - target: BabylogWatch
        embed: true
        codeSign: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app
        PRODUCT_NAME: Babylog
        INFOPLIST_FILE: Babylog/Info.plist
        CODE_SIGN_ENTITLEMENTS: Babylog/Babylog.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen 기본값(아이폰+아이패드)을 덮어써 아이폰 전용으로
        TARGETED_DEVICE_FAMILY: "1"
  # 홈 화면·잠금화면 위젯과 잠금화면 타이머(Live Activity)
  BabylogWidget:
    type: app-extension
    platform: iOS
    sources:
      - BabylogWidget
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app.widget
        PRODUCT_NAME: BabylogWidget
        INFOPLIST_FILE: BabylogWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabylogWidget/BabylogWidget.entitlements
        SKIP_INSTALL: YES

  # 애플워치 앱 (BabylogWatch). 기록은 아이폰 앱으로 보내 웹앱에 넣음 (Babylog/WatchLink.swift)
  BabylogWatch:
    type: application
    platform: watchOS
    sources:
      - BabylogWatch
      - Shared/Summary.swift
      - Shared/Tr.swift
    dependencies:
      - target: BabylogWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app.watchkitapp
        PRODUCT_NAME: BabylogWatch
        INFOPLIST_FILE: BabylogWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabylogWatch/BabylogWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  # 워치페이스 칸(컴플리케이션)·스마트 스택
  BabylogWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - BabylogWatchWidget
      - Shared/Summary.swift
      - Shared/Tr.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app.watchkitapp.widget
        PRODUCT_NAME: BabylogWatchWidget
        INFOPLIST_FILE: BabylogWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabylogWatchWidget/BabylogWatchWidget.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
