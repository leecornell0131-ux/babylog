# 아기로그 아이폰 앱 프로젝트 설정. Mac 없이 클라우드(Codemagic·GitHub Actions)에서
# XcodeGen으로 Xcode 프로젝트를 만들어 빌드함. 그래서 .xcodeproj는 저장소에 넣지 않음.
name: Babylog
options:
  bundleIdPrefix: kr.babylog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  Babylog:
    type: application
    platform: iOS
    sources:
      - Babylog
      - Shared
      # 웹앱과 잇는 코드는 갤럭시 앱과 같은 파일을 그대로 씀 (요약 계산·위젯 버튼 동작이 양쪽에서 똑같게)
      - path: ../android-app/app/src/main/assets/bridge.js
        buildPhase: resources
    dependencies:
      - target: BabylogWidget
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app
        PRODUCT_NAME: Babylog
        INFOPLIST_FILE: Babylog/Info.plist
        CODE_SIGN_ENTITLEMENTS: Babylog/Babylog.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen 기본값(아이폰+아이패드)을 덮어써 아이폰 전용으로
        TARGETED_DEVICE_FAMILY: "1"
  # 홈 화면·잠금화면 위젯과 잠금화면 타이머(Live Activity)
  BabylogWidget:
    type: app-extension
    platform: iOS
    sources:
      - BabylogWidget
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: kr.babylog.app.widget
        PRODUCT_NAME: BabylogWidget
        INFOPLIST_FILE: BabylogWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabylogWidget/BabylogWidget.entitlements
        SKIP_INSTALL: YES
