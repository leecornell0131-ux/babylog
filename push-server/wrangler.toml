# 아기로그 알림 서버 설정. 배포는 .github/workflows/push-server.yml이 함.
name = "babylog-push"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# KV id는 배포 때 워크플로가 채움 (처음이면 새로 만듦)
[[kv_namespaces]]
binding = "KV"
id = "KV_ID_PLACEHOLDER"

# 무료 D1: 빈 ID는 배포 workflow가 실제 ID로 교체. 로컬 검증에는 아래 가상 ID 사용.
[[d1_databases]]
binding = "DB"
database_name = "babylog-widget-summaries"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
